[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aaharos-backend"
version = "0.1.0"
description = "AaharOS order-to-audit backend (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pyyaml==6.0.2",
    "argon2-cffi==23.1.0",
    "PyJWT==2.10.1",
    "segno==1.6.1",
    "openpyxl==3.1.5",  # MP11: XLSX report downloads (pure Python)
    "ortools==9.11.4210",  # MP12: the batch planner (CP-SAT)  # MP10: the DEMO UPI QR on invoices (pure Python, no system libraries)
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "hypothesis==6.123.2",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "import-linter==2.1",
    "types-PyYAML==6.0.12.20241230",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app"]
pythonpath = ["."]  # import app from this source tree, never an installed copy
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"migrations/versions/0002_schema.py" = ["E501"]  # autogenerated CHECK constraints, kept verbatim

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
