# Local stack: PostgreSQL 16 + FastAPI + Vite dev server. `make up` starts it.
# Host ports: web 5180, api 8180, db 5442, chosen so AaharOS runs alongside AgriVision and Nexora.
# Values come from .env if present, otherwise the DEMO defaults below (never real secrets).
name: aaharos

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aahar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-demo}
      POSTGRES_DB: ${POSTGRES_DB:-aaharos}
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aahar} -d ${POSTGRES_DB:-aaharos}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AAHAR_ENV: ${AAHAR_ENV:-dev}
      # The API runs as the non-owner role aahar_app so row-level security applies; migrations run as the owner.
      AAHAR_DATABASE_URL: postgresql+psycopg://aahar_app:${AAHAR_APP_DB_PASSWORD:-change-me-demo}@db:5432/${POSTGRES_DB:-aaharos}
      AAHAR_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aahar}:${POSTGRES_PASSWORD:-change-me-demo}@db:5432/${POSTGRES_DB:-aaharos}
      AAHAR_APP_DB_PASSWORD: ${AAHAR_APP_DB_PASSWORD:-change-me-demo}
      # Database tests run against a throwaway database on this server and must not be skipped here.
      AAHAR_TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aahar}:${POSTGRES_PASSWORD:-change-me-demo}@db:5432/aaharos_test
      AAHAR_REQUIRE_DB: "1"
      # MP03: token signing secret (DEMO default; set your own) and the DEMO login passwords for `make seed-demo`.
      AAHAR_AUTH_SECRET: ${AAHAR_AUTH_SECRET:-dev-only-DEMO-secret-change-me-0123456789abcdef}
      DEMO_PASSWORD_SALESMAN: ${DEMO_PASSWORD_SALESMAN:-change-me-demo}
      DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:-change-me-demo}
      DEMO_PASSWORD_PRODUCTION: ${DEMO_PASSWORD_PRODUCTION:-change-me-demo}
      DEMO_PASSWORD_AUDITOR: ${DEMO_PASSWORD_AUDITOR:-change-me-demo}
      DEMO_PASSWORD_OWNER: ${DEMO_PASSWORD_OWNER:-change-me-demo}
      AAHAR_CORS_ORIGINS: '["http://localhost:5180"]'
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8180}:8000"
    volumes:
      - ./backend:/workspace/backend
      - ./benchmark:/workspace/benchmark
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: apps/web
    environment:
      API_PROXY_TARGET: http://api:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "${WEB_PORT:-5180}:5180"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
      - ./benchmark:/workspace/benchmark:ro
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
