name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Database tests (migrations, triggers, RLS) need a real PostgreSQL 16; they must not be skipped in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aahar
          POSTGRES_PASSWORD: change-me-demo
          POSTGRES_DB: aaharos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aahar -d aaharos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AAHAR_MIGRATION_DATABASE_URL: postgresql+psycopg://aahar:change-me-demo@localhost:5432/aaharos
      AAHAR_DATABASE_URL: postgresql+psycopg://aahar_app:change-me-demo@localhost:5432/aaharos
      AAHAR_TEST_DATABASE_URL: postgresql+psycopg://aahar:change-me-demo@localhost:5432/aaharos_test
      AAHAR_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . ../benchmark
      - run: ruff format --check . ../benchmark
      - run: lint-imports
      - run: mypy
      - name: Migrations apply, and models match them
        run: alembic upgrade head && alembic check
      - run: pytest
      - name: Analytics (MP16, synthetic data, never the ledger)
        working-directory: .
        env:
          PYTHONPATH: .
        run: |
          ruff check --config backend/pyproject.toml analytics
          pytest -q -p no:cacheprovider analytics/tests

  benchmark:
    runs-on: ubuntu-latest
    needs: backend
    # MP04: the replay posts the NIT movements through ledger.service, so the scoreboard needs a migrated database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aahar
          POSTGRES_PASSWORD: change-me-demo
          POSTGRES_DB: aaharos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aahar -d aaharos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AAHAR_MIGRATION_DATABASE_URL: postgresql+psycopg://aahar:change-me-demo@localhost:5432/aaharos
      AAHAR_DATABASE_URL: postgresql+psycopg://aahar_app:change-me-demo@localhost:5432/aaharos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "./backend[dev]"
      - name: Migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Scoreboard
        run: python benchmark/runner.py -q --summary "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
